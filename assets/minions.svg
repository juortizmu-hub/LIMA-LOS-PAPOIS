<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Dos personajes amarillos con gafas saludando">
  <!-- Minion 1 -->
  <g transform="translate(20,10)">
    <rect x="20" y="0" width="120" height="190" rx="60" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
    <path d="M30 120 H130 V170 Q130 185 115 185 H45 Q30 185 30 170 Z" fill="#1d4ed8"/>
    <rect x="50" y="118" width="12" height="20" rx="3" fill="#1d4ed8"/>
    <rect x="98" y="118" width="12" height="20" rx="3" fill="#1d4ed8"/>
    <circle cx="80" cy="150" r="6" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <path d="M45 40 Q80 -10 115 40" fill="none" stroke="#1f2937" stroke-width="4"/>
    <circle cx="80" cy="40" r="3" fill="#1f2937"/>
    <rect x="40" y="58" width="80" height="6" fill="#1f2937"/>
    <circle cx="60" cy="75" r="20" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
    <circle cx="100" cy="75" r="20" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
    <circle cx="60" cy="75" r="13" fill="#bfdbfe"/>
    <circle cx="100" cy="75" r="13" fill="#bfdbfe"/>
    <circle cx="63" cy="77" r="6" fill="#1f2937"/>
    <circle cx="103" cy="77" r="6" fill="#1f2937"/>
    <path d="M62 115 Q80 130 98 115 Q80 124 62 115 Z" fill="#1f2937"/>
    <path d="M62 112 Q80 136 98 112" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Minion 2 (saludando) -->
  <g transform="translate(230,30)">
    <rect x="20" y="0" width="120" height="190" rx="60" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
    <path d="M30 120 H130 V170 Q130 185 115 185 H45 Q30 185 30 170 Z" fill="#1d4ed8"/>
    <rect x="50" y="118" width="12" height="20" rx="3" fill="#1d4ed8"/>
    <rect x="98" y="118" width="12" height="20" rx="3" fill="#1d4ed8"/>
    <circle cx="80" cy="150" r="6" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <path d="M45 40 Q80 -10 115 40" fill="none" stroke="#1f2937" stroke-width="4"/>
    <rect x="40" y="58" width="80" height="6" fill="#1f2937"/>
    <circle cx="60" cy="75" r="20" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
    <circle cx="100" cy="75" r="20" fill="#9ca3af" stroke="#4b5563" stroke-width="3"/>
    <circle cx="60" cy="75" r="13" fill="#bfdbfe"/>
    <circle cx="100" cy="75" r="13" fill="#bfdbfe"/>
    <circle cx="63" cy="77" r="6" fill="#1f2937"/>
    <circle cx="103" cy="77" r="6" fill="#1f2937"/>
    <ellipse cx="80" cy="118" rx="14" ry="10" fill="#1f2937"/>
    <!-- brazo saludando -->
    <path d="M20 120 Q-10 90 -5 50" fill="none" stroke="#fde047" stroke-width="16" stroke-linecap="round"/>
    <path d="M20 120 Q-10 90 -5 50" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="0"/>
    <circle cx="-5" cy="40" r="12" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
